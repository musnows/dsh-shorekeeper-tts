<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>守岸人</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      cursor: grab;
    }
    body { display: flex; align-items: flex-end; justify-content: center; }
    .stage { position: relative; width: 192px; height: 256px; }
    .bubble {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 8px;
      max-height: 54px;
      overflow: hidden;
      padding: 6px 8px;
      border-radius: 8px;
      background: rgba(16, 20, 26, 0.72);
      color: #e7edf3;
      font: 12px/1.4 "Heiti SC", "PingFang SC", "STHeiti", sans-serif;
      opacity: 0;
      pointer-events: none;
    }
    .bubble.show { opacity: 1; }
    img {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 8px;
      width: 192px;
      height: 224px;
      object-fit: contain;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      pointer-events: none;
    }
    img.idle { animation: float 2.8s ease-in-out infinite; }
    img.listen { animation: lean 0.9s ease-in-out infinite; }
    img.think { animation: think 1.8s ease-in-out infinite; }
    img.speak { animation: talk 0.32s ease-in-out infinite; }
    button {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 18px;
      height: 18px;
      padding: 0;
      border: 0;
      border-radius: 4px;
      background: rgba(16, 20, 26, 0.45);
      color: #d5dbe3;
      font: 12px/18px sans-serif;
      cursor: pointer;
      display: none;
    }
    button.show { display: block; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes lean {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-2px) rotate(-3deg); }
    }
    @keyframes think {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px) scale(0.98); }
    }
    @keyframes talk {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div id="bubble" class="bubble"></div>
    <img id="sprite" class="idle" alt="守岸人" src="/sprites/idle.png?v=2">
    <button id="close" type="button" data-nodrag title="结束">×</button>
  </div>
  <script>
    const sprite = document.querySelector('#sprite')
    const bubble = document.querySelector('#bubble')
    const closeButton = document.querySelector('#close')
    const GATE_MAX = 0.08
    let gate = 0.012
    let lastLevelSent = 0
    const poses = {
      idle: '/sprites/idle.png?v=2',
      listen: '/sprites/listen.png?v=2',
      think: '/sprites/think.png?v=2',
      speak: '/sprites/speak.png?v=2',
    }
    for (const src of Object.values(poses)) {
      const image = new Image()
      image.src = src
    }

    let socket = null
    let audioContext = null
    let processor = null
    let stream = null
    let nextTime = 0
    let sources = []
    let sampleRate = 24000
    let pose = 'idle'
    let userSpeaking = false
    let thinking = false
    let dropAudio = false
    let responseOpen = false
    let bubbleTimer = 0
    let speakTimer = 0
    let speakUntil = 0
    let lastLevel = 0

    function showBubble(text) {
      const line = String(text || '').trim()
      if (!line) return
      bubble.textContent = line.length > 42 ? `${line.slice(0, 42)}…` : line
      bubble.classList.add('show')
      clearTimeout(bubbleTimer)
      bubbleTimer = setTimeout(() => bubble.classList.remove('show'), 8000)
    }

    function renderPose() {
      const next = userSpeaking ? 'listen' : performance.now() < speakUntil ? 'speak' : thinking ? 'think' : 'idle'
      if (next === pose) return
      pose = next
      sprite.src = poses[next]
      sprite.className = next
    }

    function stopPlayback() {
      speakUntil = 0
      clearTimeout(speakTimer)
      window.webkit?.messageHandlers?.pet?.postMessage({ kind: 'stop-audio' })
      for (const source of sources) {
        try { source.stop() } catch {}
      }
      sources = []
      if (audioContext) nextTime = audioContext.currentTime
      renderPose()
    }

    function playPcm(base64) {
      if (dropAudio) return
      const native = window.webkit?.messageHandlers?.pet
      if (native) {
        native.postMessage({ kind: 'audio', pcm: base64, rate: sampleRate })
        const samples = atob(base64).length / 2
        const now = performance.now()
        speakUntil = Math.max(speakUntil, now) + samples / sampleRate * 1000
        userSpeaking = false
        thinking = false
        renderPose()
        clearTimeout(speakTimer)
        speakTimer = setTimeout(renderPose, Math.max(0, speakUntil - performance.now()) + 40)
        return
      }
      if (!audioContext) return
      const bytes = Uint8Array.from(atob(base64), char => char.charCodeAt(0))
      const view = new Int16Array(bytes.buffer)
      const floats = new Float32Array(view.length)
      for (let index = 0; index < view.length; index += 1) floats[index] = view[index] / 32768
      const buffer = audioContext.createBuffer(1, floats.length, sampleRate)
      buffer.copyToChannel(floats, 0)
      const source = audioContext.createBufferSource()
      source.buffer = buffer
      source.connect(audioContext.destination)
      const start = Math.max(audioContext.currentTime + 0.05, nextTime)
      source.start(start)
      nextTime = start + buffer.duration
      sources.push(source)
      userSpeaking = false
      thinking = false
      renderPose()
      source.onended = () => {
        sources = sources.filter(item => item !== source)
        if (sources.length === 0 && !responseOpen) thinking = false
        renderPose()
      }
    }

    function levelOf(samples) {
      let sum = 0
      for (let index = 0; index < samples.length; index += 1) sum += samples[index] * samples[index]
      return Math.sqrt(sum / samples.length)
    }

    function downsample(input, inputRate) {
      const ratio = inputRate / 24000
      const length = Math.floor(input.length / ratio)
      const pcm = new Int16Array(length)
      for (let index = 0; index < length; index += 1) {
        const sample = input[Math.floor(index * ratio)]
        pcm[index] = Math.max(-1, Math.min(1, sample)) * 0x7fff
      }
      const bytes = new Uint8Array(pcm.buffer)
      let binary = ''
      for (const byte of bytes) binary += String.fromCharCode(byte)
      return btoa(binary)
    }

    async function start() {
      if (socket && socket.readyState === WebSocket.OPEN) return
      thinking = true
      renderPose()
      socket = new WebSocket(`ws://${location.host}/ws`)
      socket.onmessage = onSocket
      socket.onclose = () => {
        thinking = false
        userSpeaking = false
        stopPlayback()
        showBubble('连接断了，点我再连')
      }
      audioContext = new AudioContext()
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
      })
      await audioContext.resume()
      const source = audioContext.createMediaStreamSource(stream)
      processor = audioContext.createScriptProcessor(4096, 1, 1)
      const mute = audioContext.createGain()
      mute.gain.value = 0
      processor.onaudioprocess = event => {
        if (!socket || socket.readyState !== WebSocket.OPEN) return
        const input = event.inputBuffer.getChannelData(0)
        const level = levelOf(input)
        lastLevel = level
        const now = performance.now()
        const playing = now < speakUntil
        const loudEnough = level >= Math.max(gate * 3, 0.05)
        if (now - lastLevelSent > 80) {
          lastLevelSent = now
          socket.send(JSON.stringify({ type: 'level', value: Math.round(level * 1000) / 1000 }))
        }
        const pass = playing ? loudEnough : level >= gate
        const heard = pass ? input : new Float32Array(input.length)
        const pcm = downsample(heard, audioContext.sampleRate)
        socket.send(JSON.stringify({ type: 'audio', pcm }))
      }
      source.connect(processor)
      processor.connect(mute)
      mute.connect(audioContext.destination)
      nextTime = audioContext.currentTime
    }

    function onSocket(event) {
      const message = JSON.parse(event.data)
      if (message.type === 'gate') {
        const value = Number(message.value)
        if (Number.isFinite(value)) gate = Math.min(GATE_MAX, Math.max(0, value))
      }
      if (message.type === 'ready') {
        sampleRate = message.rate || 24000
        thinking = false
        renderPose()
      }
      if (message.type === 'error') showBubble(message.message)
      if (message.type === 'interrupt') {
        const echo = performance.now() < speakUntil && lastLevel < Math.max(gate * 3, 0.05)
        if (!echo) {
          userSpeaking = true
          dropAudio = true
          thinking = false
          socket?.send(JSON.stringify({ type: 'cut' }))
          stopPlayback()
        }
      }
      if (message.type === 'listen-end') userSpeaking = false
      if (message.type === 'think') {
        thinking = true
        userSpeaking = false
      }
      if (message.type === 'audio') playPcm(message.pcm)
      if (message.type === 'response-done') {
        responseOpen = false
        dropAudio = false
        if (sources.length === 0) thinking = false
      }
      if (message.type === 'response-started') {
        responseOpen = true
        thinking = true
        userSpeaking = false
      }
      if (message.type === 'caption' && message.role === 'her' && message.text) showBubble(message.text)
      renderPose()
    }

    function stop() {
      processor?.disconnect()
      stream?.getTracks().forEach(track => track.stop())
      socket?.close()
      stopPlayback()
      audioContext?.close()
      processor = null
      stream = null
      socket = null
      audioContext = null
      thinking = false
      userSpeaking = false
      renderPose()
    }

    closeButton.addEventListener('click', event => {
      event.stopPropagation()
      stop()
      window.webkit?.messageHandlers?.pet?.postMessage({ kind: 'close' })
    })

    window.addEventListener('contextmenu', event => {
      event.preventDefault()
      closeButton.classList.add('show')
    })

    let dragging = false
    let moved = false
    let last = null
    window.addEventListener('pointerdown', event => {
      if (event.button !== 0) return
      if (!event.target.closest('#close')) closeButton.classList.remove('show')
      if (event.target.closest('[data-nodrag]')) return
      dragging = true
      moved = false
      last = { x: event.screenX, y: event.screenY }
    })
    window.addEventListener('pointermove', event => {
      if (!dragging || !last) return
      const dx = event.screenX - last.x
      const dy = event.screenY - last.y
      if (Math.abs(dx) + Math.abs(dy) > 3) moved = true
      last = { x: event.screenX, y: event.screenY }
      window.webkit?.messageHandlers?.pet?.postMessage({ kind: 'move', dx, dy })
    })
    window.addEventListener('pointerup', () => {
      const wasDrag = moved
      dragging = false
      last = null
      if (!wasDrag && (!socket || socket.readyState !== WebSocket.OPEN)) {
        start().catch(error => showBubble(error.message))
      }
    })

    start().catch(error => showBubble(error.message))
  </script>
</body>
</html>
